{% extends 'cursos/base.html' %}
{% block title %}Checkout - NexiaApp{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-md border border-gray-100 my-8">
    <h2 class="text-2xl font-bold text-gray-900 mb-2">Simulación de Pago</h2>
    {% if curso %}
        <p class="text-gray-600 mb-6">Estás adquiriendo: <span class="font-bold text-indigo-600">{{ curso.titulo }}</span> por <span class="font-bold text-gray-900">${{ curso.precio }}</span></p>
    {% endif %}
    
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre en la Tarjeta</label>
            <input type="text" value="Mack Daorta" required class="w-full border border-gray-300 rounded-lg p-2.5">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Número de Tarjeta (Falsa)</label>
            <input type="text" value="4242 •••• •••• 4242" required class="w-full border border-gray-300 rounded-lg p-2.5">
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Expira</label>
                <input type="text" value="12/28" required class="w-full border border-gray-300 rounded-lg p-2.5">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">CVV</label>
                <input type="password" value="123" required class="w-full border border-gray-300 rounded-lg p-2.5">
            </div>
        </div>
        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition shadow">Pagar e Inscribirme</button>
    </form>
</div>
{% endblock %}
