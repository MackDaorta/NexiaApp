{% extends 'cursos/base.html' %}

{% block title %}Iniciar Sesión - NexiaApp{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-md border border-gray-100 my-8">
    <h2 class="text-2xl font-bold text-center text-gray-900 mb-6">Iniciar Sesión</h2>
    
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg transition">Entrar</button>
    </form>
    
    <p class="text-center text-sm text-gray-600 mt-6">
        ¿No tienes cuenta? <a href="{% url 'registro' %}" class="text-indigo-600 font-medium hover:underline">Regístrate aquí</a>
    </p>
</div>
{% endblock %}
