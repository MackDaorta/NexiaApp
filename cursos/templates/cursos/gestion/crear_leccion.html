{% extends 'cursos/base.html' %}
{% block title %}Añadir Clase - NexiaApp{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto bg-white p-8 rounded-2xl shadow-md border border-gray-100 my-8">
    <h2 class="text-xl font-bold text-gray-900 mb-2">Añadir Clase / Lección</h2>
    <p class="text-sm text-gray-600 mb-6">Módulo: <span class="font-semibold text-indigo-600">{{ modulo.titulo }}</span></p>
    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Título de la Clase</label>
            <input type="text" name="titulo" required class="w-full border border-gray-300 rounded-lg p-2.5">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Orden</label>
            <input type="number" name="orden" value="1" required class="w-full border border-gray-300 rounded-lg p-2.5">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Archivo de Video (.mp4)</label>
            <input type="file" name="video" accept="video/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-indigo-50 file:text-indigo-700">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Material PDF Adjunto</label>
            <input type="file" name="pdf_adjunto" accept=".pdf" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-indigo-50 file:text-indigo-700">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition">Subir Clase</button>
    </form>
</div>
{% endblock %}
