{% extends 'cursos/base.html' %}
{% block title %}Crear Curso - NexiaApp{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-md border border-gray-100 my-8">
    <h2 class="text-2xl font-bold text-gray-900 mb-6">Crear Nuevo Curso</h2>
    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Título del Curso</label>
            <input type="text" name="titulo" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-indigo-500 focus:border-indigo-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
            <textarea name="descripcion" rows="4" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-indigo-500 focus:border-indigo-500"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Precio ($)</label>
                <input type="number" step="0.01" name="precio" value="0.00" required class="w-full border border-gray-300 rounded-lg p-2.5">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Imagen de Portada</label>
                <input type="file" name="portada" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Categorías (Temáticas de Interés)</label>
            <div class="grid grid-cols-2 gap-2 bg-gray-50 p-4 rounded-lg border border-gray-200">
                {% for cat in categorias %}
                    <label class="flex items-center space-x-2 text-sm text-gray-700">
                        <input type="checkbox" name="categorias" value="{{ cat.id }}" class="rounded text-indigo-600 focus:ring-indigo-500">
                        <span>{{ cat.nombre }}</span>
                    </label>
                {% endfor %}
            </div>
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition">Guardar y Continuar</button>
    </form>
</div>
{% endblock %}
