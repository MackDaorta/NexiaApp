{% extends 'cursos/base.html' %}
{% block title %}Añadir Módulo - NexiaApp{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-md border border-gray-100 my-8">
    <h2 class="text-xl font-bold text-gray-900 mb-2">Añadir Módulo / Parte</h2>
    <p class="text-sm text-gray-600 mb-6">Para el curso: <span class="font-semibold text-indigo-600">{{ curso.titulo }}</span></p>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Título del Módulo (Ej: Parte 1: Fundamentos)</label>
            <input type="text" name="titulo" required class="w-full border border-gray-300 rounded-lg p-2.5">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Número de Orden</label>
            <input type="number" name="orden" value="1" required class="w-full border border-gray-300 rounded-lg p-2.5">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg transition">Crear Módulo</button>
    </form>
</div>
{% endblock %}
